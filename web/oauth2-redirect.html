<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign-in — HZN Laundry</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      color-scheme: light;
      --text: #1a1a1a;
      --muted: #555;
      --bg: #fafafa;
      --error: #b00020;
      --ok: #1b5e20;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      padding: 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 600;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 28rem;
    }

    .error h1 { color: var(--error); }
    .ok h1 { color: var(--ok); }
  </style>
</head>
<body>
  <main id="main">
    <h1 id="title">Completing sign-in…</h1>
    <p id="detail">This window will close automatically.</p>
  </main>
  <script>
    (function () {
      var MESSAGE_TYPE = 'hzn_oauth2_redirect';
      var ACK_TYPE = 'hzn_oauth2_ack';
      var mainEl = document.getElementById('main');
      var titleEl = document.getElementById('title');
      var detailEl = document.getElementById('detail');
      var settled = false;

      function setStatus(kind, title, detail) {
        mainEl.className = kind || '';
        titleEl.textContent = title;
        detailEl.textContent = detail;
      }

      function tryClose() {
        try {
          // Helps some browsers allow script-initiated close after OAuth redirects.
          history.replaceState(null, '', location.pathname);
        } catch (_) {}
        try {
          window.close();
        } catch (_) {}
        // If the browser blocks close, leave the fallback copy visible.
        setTimeout(function () {
          if (!window.closed) {
            setStatus(
              'ok',
              'Sign-in complete',
              'You can close this window. Sign-in is finishing in the app.'
            );
          }
        }, 250);
      }

      function postToOpener(payload) {
        if (!window.opener || window.opener.closed) {
          return false;
        }
        try {
          window.opener.postMessage(payload, '*');
          return true;
        } catch (_) {
          return false;
        }
      }

      var params = new URLSearchParams(window.location.search);
      var code = params.get('code') || '';
      var state = params.get('state') || '';
      var error = params.get('error') || '';
      var errorDescription = params.get('error_description') || '';

      if (error || !code || !state) {
        var failDetail = errorDescription || error || 'Missing authorization code.';
        setStatus(
          'error',
          'Sign-in failed',
          failDetail + ' You can close this window and try again in the app.'
        );
        postToOpener({
          type: MESSAGE_TYPE,
          code: '',
          state: state,
          error: error || 'missing_code',
          errorDescription: failDetail,
        });
        tryClose();
        return;
      }

      setStatus(
        '',
        'Sign-in complete',
        'This window will close automatically.'
      );

      var delivered = postToOpener({
        type: MESSAGE_TYPE,
        code: code,
        state: state,
        error: '',
        errorDescription: '',
      });

      if (!delivered) {
        setStatus(
          'ok',
          'Sign-in complete',
          'You can close this window and return to the app.'
        );
        return;
      }

      function onAck(event) {
        var data = event.data;
        if (!data || data.type !== ACK_TYPE) return;
        if (settled) return;
        settled = true;
        window.removeEventListener('message', onAck);

        if (data.ok) {
          setStatus(
            'ok',
            'Sign-in complete',
            'This window will close automatically.'
          );
          tryClose();
          return;
        }

        setStatus(
          'error',
          'Sign-in failed',
          (data.message || 'Could not finish sign-in.') +
            ' You can close this window and try again in the app.'
        );
        tryClose();
      }

      window.addEventListener('message', onAck);

      // Don't wait forever if the opener never acks.
      setTimeout(function () {
        if (settled) return;
        settled = true;
        window.removeEventListener('message', onAck);
        setStatus(
          'ok',
          'Sign-in complete',
          'You can close this window. Sign-in is finishing in the app.'
        );
        tryClose();
      }, 8000);
    })();
  </script>
</body>
</html>
