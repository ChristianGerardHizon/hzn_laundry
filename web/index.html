  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes splash-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    #splash-status {
      position: absolute;
      top: calc(50% + 200px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #444;
      letter-spacing: 0.06em;
      white-space: nowrap;
      pointer-events: none;
      animation: splash-pulse 2s ease-in-out infinite;
    }

    #splash-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(68, 68, 68, 0.2);
      border-top-color: #444;
      border-radius: 50%;
      flex-shrink: 0;
      animation: splash-spin 0.8s linear infinite;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.getElementById("splash-status")?.remove();
      document.body.style.background = "transparent";
      if (window._splashVerbInterval) clearInterval(window._splashVerbInterval);
    }

    (function () {
      var verbs = [
        "Building", "Generating", "Compiling", "Assembling",
        "Rendering", "Constructing", "Bundling", "Bootstrapping",
        "Wiring up", "Scaffolding"
      ];
      var idx = 0;

      function next() {
        idx = (idx + 1) % verbs.length;
        var el = document.getElementById("splash-verb");
        if (!el) return;
        el.style.opacity = "0";
        el.style.transition = "opacity 0.25s ease";
        setTimeout(function () {
          el.textContent = verbs[idx] + "…";
          el.style.opacity = "";
          el.style.transition = "";
        }, 250);
      }

      document.addEventListener("DOMContentLoaded", function () {
        var el = document.getElementById("splash-verb");
        if (!el) return;
        el.textContent = verbs[0] + "…";
        window._splashVerbInterval = setInterval(next, 2200);
      });
    })();
  </script>
</head>
<body>
  <div id="splash-status"><div id="splash-spinner"></div><span id="splash-verb"></span></div>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  <script src="flutter_bootstrap.js" async=""></script>











</body></html>
