<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your HZN Laundry staff account password.">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password — HZN Laundry</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      color-scheme: light;
      --text: #1a1a1a;
      --muted: #555;
      --border: #e5e5e5;
      --accent: #1565c0;
      --bg: #fafafa;
      --card: #ffffff;
      --error: #b00020;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.9rem;
      line-height: 1.2;
    }

    .updated {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 0 0 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .message {
      margin: 0 0 12px;
      color: var(--muted);
    }

    .error { color: var(--error); }
    .ok { color: #1b5e20; }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Reset password</h1>
      <p class="updated">HZN Laundry staff account</p>
    </header>

    <section>
      <p id="status" class="message">Enter a new password for your account.</p>
      <form id="reset-form">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
        <label for="passwordConfirm">Confirm password</label>
        <input id="passwordConfirm" name="passwordConfirm" type="password" required minlength="8" autocomplete="new-password">
        <button type="submit" id="submit">Update password</button>
      </form>
    </section>

    <footer>
      <p>
        App package: <code>com.hznsystems.hznlaundry</code><br>
        Production site: <a href="https://hznlaundry.hznsystems.com/">hznlaundry.hznsystems.com</a>
      </p>
    </footer>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get("token") || "";
      var form = document.getElementById("reset-form");
      var status = document.getElementById("status");
      var submit = document.getElementById("submit");

      if (!token) {
        status.className = "message error";
        status.textContent = "This reset link is missing a token. Request a new password reset from the app.";
        form.style.display = "none";
        return;
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var password = document.getElementById("password").value;
        var passwordConfirm = document.getElementById("passwordConfirm").value;
        if (password !== passwordConfirm) {
          status.className = "message error";
          status.textContent = "Passwords do not match.";
          return;
        }

        submit.disabled = true;
        status.className = "message";
        status.textContent = "Updating password…";

        fetch("/api/collections/users/confirm-password-reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: token,
            password: password,
            passwordConfirm: passwordConfirm
          })
        }).then(function (response) {
          return response.text().then(function (text) {
            var payload = {};
            try { payload = text ? JSON.parse(text) : {}; } catch (err) {}
            if (!response.ok) {
              var message = payload.message || "Could not reset password. Request a new link.";
              throw new Error(message);
            }
          });
        }).then(function () {
          status.className = "message ok";
          status.textContent = "Password updated. You can sign in with your email and new password.";
          form.style.display = "none";
        }).catch(function (err) {
          submit.disabled = false;
          status.className = "message error";
          status.textContent = err.message || "Could not reset password.";
        });
      });
    })();
  </script>
</body>
</html>
