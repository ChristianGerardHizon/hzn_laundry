name: Auto Promote to Main

on:
  pull_request:
    types: [closed]
    branches: ["staging"]

jobs:
  promote:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'deploy')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Get version from latest staging release
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wait for the deploy workflow to create the staging release
          # Try up to 30 times with 20s intervals (10 min max)
          for i in $(seq 1 30); do
            TAG=$(gh release list \
              --repo "${{ github.repository }}" \
              --limit 5 \
              --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | last | .tagName // empty')

            if [ -n "$TAG" ]; then
              VERSION=$(echo "$TAG" | sed 's/^staging-//' | sed 's/-build\..*//')
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "Found staging version: $VERSION (attempt $i)"
              exit 0
            fi

            echo "Waiting for staging release... (attempt $i/30)"
            sleep 20
          done

          echo "version=unknown" >> $GITHUB_OUTPUT
          echo "::warning::Could not determine staging version from releases"

      - name: Create PR from staging to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Check if an open PR from staging to main already exists
          EXISTING=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head staging \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING from staging to main already exists. Skipping."
            exit 0
          fi

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --head staging \
            --base main \
            --title "Deploy v${VERSION} to Production" \
            --body "$(cat <<EOF
          ## Production Deployment — v${VERSION}

          This PR was automatically created after merging PR #${{ github.event.pull_request.number }} into staging.

          **Source PR:** ${{ github.event.pull_request.title }}

          Merging this PR will build and deploy **v${VERSION}** to production.
          EOF
          )")

          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')

          echo "Created PR #$PR_NUMBER"

          # Forward version and minimum version labels from source PR
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          FORWARD_LABELS=""

          if echo "$LABELS" | grep -q '"version:major"'; then
            FORWARD_LABELS="version:major"
          elif echo "$LABELS" | grep -q '"version:minor"'; then
            FORWARD_LABELS="version:minor"
          elif echo "$LABELS" | grep -q '"version:patch"'; then
            FORWARD_LABELS="version:patch"
          fi

          if echo "$LABELS" | grep -q '"minimum version"'; then
            if [ -n "$FORWARD_LABELS" ]; then
              FORWARD_LABELS="$FORWARD_LABELS,minimum version"
            else
              FORWARD_LABELS="minimum version"
            fi
          fi

          if [ -n "$FORWARD_LABELS" ]; then
            gh pr edit "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --add-label "$FORWARD_LABELS"
            echo "Forwarded labels: $FORWARD_LABELS"
          fi
