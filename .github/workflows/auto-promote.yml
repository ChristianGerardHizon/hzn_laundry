name: Auto Promote to Main

on:
  pull_request:
    types: [closed]
    branches: ["staging"]

jobs:
  promote:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'deploy')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Calculate next version
        id: get_version
        env:
          URL: ${{ secrets.VERSION_MANAGER_URL }}
          ID: ${{ secrets.VERSION_COLLECTION_ID }}
        run: |
          # Read current version from the same source as the deploy workflow
          RESPONSE=$(curl -s "$URL/$ID")
          MAJOR=$(echo $RESPONSE | jq -r '.major')
          MINOR=$(echo $RESPONSE | jq -r '.minor')
          PATCH=$(echo $RESPONSE | jq -r '.patch')

          if [ "$MAJOR" == "null" ]; then
            echo "version=unknown" >> $GITHUB_OUTPUT
            echo "::warning::Failed to read version from API"
            exit 0
          fi

          # Determine bump type from the PR labels
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"version:major"'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$LABELS" | grep -q '"version:minor"'; then
            MINOR=$((MINOR + 1)); PATCH=0
          elif echo "$LABELS" | grep -q '"version:patch"'; then
            PATCH=$((PATCH + 1))
          fi

          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated next version: $VERSION"

      - name: Compile release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/compile_release_notes.py \
            --repo "${{ github.repository }}" \
            --mode production \
            --output-markdown release-notes/release-notes.md \
            --output-play release-notes/whatsnew/whatsnew-en-US
          {
            echo "body<<EOF"
            cat release-notes/release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR from staging to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.body }}
        run: |
          # Check if an open PR from staging to main already exists
          EXISTING=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head staging \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING from staging to main already exists. Skipping."
            exit 0
          fi

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --head staging \
            --base main \
            --title "Deploy v${VERSION} to Production" \
            --body "$(cat <<EOF
          ## Production Deployment — v${VERSION}

          This PR was automatically created after merging PR #${{ github.event.pull_request.number }} into staging.

          **Source PR:** ${{ github.event.pull_request.title }}

          Merging this PR will build and deploy **v${VERSION}** to production.

          ${RELEASE_NOTES}
          EOF
          )")

          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')

          echo "Created PR #$PR_NUMBER"

          # Forward version and minimum version labels from source PR
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          FORWARD_LABELS=""

          if echo "$LABELS" | grep -q '"version:major"'; then
            FORWARD_LABELS="version:major"
          elif echo "$LABELS" | grep -q '"version:minor"'; then
            FORWARD_LABELS="version:minor"
          elif echo "$LABELS" | grep -q '"version:patch"'; then
            FORWARD_LABELS="version:patch"
          fi

          if echo "$LABELS" | grep -q '"minimum version"'; then
            if [ -n "$FORWARD_LABELS" ]; then
              FORWARD_LABELS="$FORWARD_LABELS,minimum version"
            else
              FORWARD_LABELS="minimum version"
            fi
          fi

          if echo "$LABELS" | grep -q '"build-windows"'; then
            FORWARD_LABELS="${FORWARD_LABELS:+$FORWARD_LABELS,}build-windows"
          fi

          if [ -n "$FORWARD_LABELS" ]; then
            gh pr edit "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --add-label "$FORWARD_LABELS"
            echo "Forwarded labels: $FORWARD_LABELS"
          fi
